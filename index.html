<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Sales Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111111, #25154a);
            color: white;
        }

        .container {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        h1 {
            font-size: 52px;
            margin: 0 0 15px;
        }

        .subtitle {
            font-size: 20px;
            color: #d8d8d8;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;

            background: #8b5cf6;
            color: white;

            padding: 16px 40px;

            border-radius: 30px;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            transition: 0.3s;
        }

        .button:hover {
            background: #a78bfa;
            transform: scale(1.05);
        }

        .footer {
            position: absolute;
            bottom: 20px;

            font-size: 13px;
            color: #999999;
        }

    </style>
</head>


<body>

    <div class="container">

        <h1>My Sales Dashboard</h1>

        <div class="subtitle">
            Interactive Sales Performance Dashboard
        </div>


        <a
            href="https://datastudio.google.com/reporting/603d9c60-537d-49a8-951e-6c47737333d4"
            target="_blank"
            class="button">

            View Dashboard

        </a>


        <div class="footer">
            Sales Dashboard © 2026
        </div>

    </div>

</body>

</html>
